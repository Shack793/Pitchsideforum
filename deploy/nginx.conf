# Pitchside Forum: Nginx site config. setup.sh fills in DOMAIN and PHP_SOCK, and Certbot adds HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;
    root /var/www/pitchside/public;
    index index.php;

    client_max_body_size 14m;
    server_tokens off;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The app's JavaScript has its version in the file name, so it can be cached for a year
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable" always; add_header X-Content-Type-Options "nosniff" always; try_files $uri =404; }

    # Uploaded avatars and ad images: served as plain files, never run as code
    location /uploads/ {
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
        location ~ \.(php|phtml|phar|html?|svg|js)$ { deny all; }
        try_files $uri =404;
    }
    location ~* \.(ico|png|svg|webp|jpg|jpeg)$ { expires 7d; try_files $uri =404; }

    # API, tracked redirects and the sitemap
    location /api/ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root/api.php; fastcgi_pass unix:PHP_SOCK; fastcgi_read_timeout 60s; }
    location /go/  { include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root/go.php;  fastcgi_pass unix:PHP_SOCK; }
    location = /sitemap.xml { include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root/sitemap.php; fastcgi_pass unix:PHP_SOCK; }

    # No other PHP file can be requested directly
    location ~ \.php$ { return 404; }
    # Hidden files stay hidden; Let's Encrypt's .well-known folder stays reachable
    location ~ /\.(?!well-known) { deny all; }

    # Every page (/, /topic/123, /forum/premier-league, /robots.txt…) is built by index.php
    location / { try_files $uri @app; }
    location @app { include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root/index.php; fastcgi_pass unix:PHP_SOCK; }
}
