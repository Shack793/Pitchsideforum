# Pitchside Forum: Nginx site config for a Namecheap Quasar VPS (Ubuntu)
# setup.sh replaces example.com with your domain and installs this file.
# Certbot adds the HTTPS (port 443) block automatically after it gets the certificate.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /var/www/pitchside;
    index index.html;

    # Every page of the app is served by index.html (links like /sports or /go/stakeline included)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The page itself: always check for a newer version
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Icons change rarely: cache for a week
    location ~* \.(ico|png|svg|webp|jpg|jpeg)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # Smaller downloads (text/html is always compressed by nginx, so not listed)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Never serve hidden files (.git, .env and so on); Let's Encrypt's .well-known folder stays reachable
    location ~ /\.(?!well-known) { deny all; }

    client_max_body_size 10m;
    server_tokens off;
}
